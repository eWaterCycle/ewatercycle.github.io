name: Link Checker
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  linkChecker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: lychee Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2.0.2
        with:
          args: --verbose --no-progress *.html *.md
